name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the browser run it left going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VITE_BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  changes:
    # Decides whether the browser tests need to run for this change. A job
    # skipped by its `if` reports success, so required checks never hang.
    name: Detect browser-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Classify the changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SKIP_IF: '^(docs/.*|.*\.md|LICENSE|\.github/workflows/deploy-pages\.yml)$'
        run: |
          browser=true
          changed=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch -q --depth=1 origin "$BEFORE"; then changed=$(git diff --name-only "$BEFORE" HEAD); fi
          fi
          if [ -n "$changed" ]; then
            if [ -n "${RUN_IF:-}" ]; then
              echo "$changed" | grep -qE "$RUN_IF" || browser=false
            else
              echo "$changed" | grep -qvE "$SKIP_IF" || browser=false
            fi
          fi
          echo "Changed files:"
          echo "$changed"
          echo "browser=$browser" | tee -a "$GITHUB_OUTPUT"

  validate:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:browser

      - name: Preserve browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build GitHub Pages artifact
        run: npm run build

  blender:
    name: Blender asset handoff
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install asset bake and DCC runtimes
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y blender
      - name: Build actual source projects and verify Blender imports
        run: |
          npm run build:assets -- --out test-results/dcc examples/assets/service-module.greebler.json examples/assets/reactor-core.greebler.json
          blender --background --factory-startup --python-exit-code 1 --python tools/verify-asset-blender.py -- test-results/dcc/service-module.glb --project examples/assets/service-module.greebler.json --render test-results/dcc/service-module-blender.png --samples 32 --width 1000
          blender --background --factory-startup --python-exit-code 1 --python tools/verify-asset-blender.py -- test-results/dcc/reactor-core.glb --project examples/assets/reactor-core.greebler.json
      - name: Preserve DCC assets, reports and render
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blender-evidence
          path: test-results/dcc/
          if-no-files-found: ignore
          retention-days: 7
