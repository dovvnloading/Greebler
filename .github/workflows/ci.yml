name: Validate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_browser_tests:
        description: Run optional Chromium smoke tests
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same pull request cancels the browser run it left going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VITE_BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  changes:
    # Only browser steps depend on this classification; validation always runs.
    name: Detect browser-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Classify the changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_BROWSER_TESTS: ${{ inputs.run_browser_tests }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: bash tools/ci-browser-policy.sh "$EVENT_NAME" "$RUN_BROWSER_TESTS" "$BEFORE" | tee -a "$GITHUB_OUTPUT"

  validate:
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test browser policy
        run: bash tools/test-ci-browser-policy.sh

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        if: needs.changes.outputs.browser != 'false'
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        if: needs.changes.outputs.browser != 'false'
        run: npm run test:browser

      - name: Build GitHub Pages artifact
        run: npm run build
