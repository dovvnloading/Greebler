name: Validate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_browser_tests:
        description: Run optional Chromium smoke tests
        type: boolean
        default: false

permissions:
  contents: read

env:
  VITE_BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_browser_tests }}
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_browser_tests }}
        run: npm run test:browser

      - name: Build GitHub Pages artifact
        run: npm run build
