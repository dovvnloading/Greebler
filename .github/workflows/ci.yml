name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build GitHub Pages artifact
        run: npm run build
